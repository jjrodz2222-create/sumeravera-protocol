apiVersion: v1
kind: Namespace
metadata:
  name: svp
---
# ── PersistentVolumeClaims ────────────────────────────────────────────────────
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: sumera-data
  namespace: svp
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 5Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: paws-data
  namespace: svp
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 2Gi
---
# ── SumerA Layer ──────────────────────────────────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sumera-layer
  namespace: svp
  labels:
    app: sumera-layer
    tier: ledger
spec:
  replicas: 1
  selector:
    matchLabels:
      app: sumera-layer
  template:
    metadata:
      labels:
        app: sumera-layer
        tier: ledger
    spec:
      containers:
        - name: sumera-layer
          image: svp/sumera-layer:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 3001
          env:
            - name: PORT
              value: "3001"
            - name: DB_PATH
              value: "/data/sumera.db"
            - name: NODE_ENV
              value: "production"
          volumeMounts:
            - name: sumera-data
              mountPath: /data
          livenessProbe:
            httpGet:
              path: /health
              port: 3001
            initialDelaySeconds: 10
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /health
              port: 3001
            initialDelaySeconds: 5
            periodSeconds: 10
      volumes:
        - name: sumera-data
          persistentVolumeClaim:
            claimName: sumera-data
---
apiVersion: v1
kind: Service
metadata:
  name: sumera-layer
  namespace: svp
spec:
  selector:
    app: sumera-layer
  ports:
    - port: 3001
      targetPort: 3001
---
# ── Avera Engine ──────────────────────────────────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: avera-engine
  namespace: svp
  labels:
    app: avera-engine
    tier: validation
spec:
  replicas: 2
  selector:
    matchLabels:
      app: avera-engine
  template:
    metadata:
      labels:
        app: avera-engine
        tier: validation
    spec:
      containers:
        - name: avera-engine
          image: svp/avera-engine:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 3002
          env:
            - name: PORT
              value: "3002"
            - name: SUMERA_URL
              value: "http://sumera-layer:3001"
            - name: HONEYPOT_URL
              value: "http://honeypot-perimeter:3003"
            - name: NODE_ENV
              value: "production"
          livenessProbe:
            httpGet:
              path: /health
              port: 3002
            initialDelaySeconds: 10
            periodSeconds: 15
---
apiVersion: v1
kind: Service
metadata:
  name: avera-engine
  namespace: svp
spec:
  selector:
    app: avera-engine
  ports:
    - port: 3002
      targetPort: 3002
---
# ── Honeypot Perimeter ────────────────────────────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: honeypot-perimeter
  namespace: svp
  labels:
    app: honeypot-perimeter
    tier: edge
spec:
  replicas: 2
  selector:
    matchLabels:
      app: honeypot-perimeter
  template:
    metadata:
      labels:
        app: honeypot-perimeter
        tier: edge
    spec:
      containers:
        - name: honeypot-perimeter
          image: svp/honeypot-perimeter:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 3003
          env:
            - name: PORT
              value: "3003"
            - name: SUMERA_URL
              value: "http://sumera-layer:3001"
            - name: NODE_ENV
              value: "production"
          livenessProbe:
            httpGet:
              path: /health
              port: 3003
            initialDelaySeconds: 10
            periodSeconds: 15
---
apiVersion: v1
kind: Service
metadata:
  name: honeypot-perimeter
  namespace: svp
  annotations:
    # Expose as LoadBalancer so the honeypot is reachable at the network edge
    service.beta.kubernetes.io/aws-load-balancer-type: nlb
spec:
  selector:
    app: honeypot-perimeter
  type: LoadBalancer
  ports:
    - port: 80
      targetPort: 3003
---
# ── Paws Connect ──────────────────────────────────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: paws-connect
  namespace: svp
  labels:
    app: paws-connect
    tier: identity
spec:
  replicas: 1
  selector:
    matchLabels:
      app: paws-connect
  template:
    metadata:
      labels:
        app: paws-connect
        tier: identity
    spec:
      containers:
        - name: paws-connect
          image: svp/paws-connect:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 3004
          env:
            - name: PORT
              value: "3004"
            - name: DB_PATH
              value: "/data/paws.db"
            - name: SUMERA_URL
              value: "http://sumera-layer:3001"
            - name: AVERA_URL
              value: "http://avera-engine:3002"
            - name: NODE_ENV
              value: "production"
          volumeMounts:
            - name: paws-data
              mountPath: /data
          livenessProbe:
            httpGet:
              path: /health
              port: 3004
            initialDelaySeconds: 10
            periodSeconds: 15
      volumes:
        - name: paws-data
          persistentVolumeClaim:
            claimName: paws-data
---
apiVersion: v1
kind: Service
metadata:
  name: paws-connect
  namespace: svp
spec:
  selector:
    app: paws-connect
  ports:
    - port: 3004
      targetPort: 3004
