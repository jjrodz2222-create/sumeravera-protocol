name: SVP CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate-schemas:
    name: Validate Protocol Schemas
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache-dependency-path: '**/package-lock.json'

      - name: Validate JSON Schemas
        run: |
          node -e "JSON.parse(require('fs').readFileSync('schemas/paws-connect-identity.json'))"
          node -e "JSON.parse(require('fs').readFileSync('schemas/dynamic-icon-state.json'))"
          echo "All SumerAvera protocol schemas validated successfully."

  build-android:
    name: Build Android Application
    runs-on: ubuntu-latest
    needs: validate-schemas
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build Debug APK
        run: gradle assembleDebug --stacktrace

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: svp-android-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
