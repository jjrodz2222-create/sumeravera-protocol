
name: Validate SumerAvera Schemas

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  validate-json:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository Code
        uses: actions/checkout@v4

      - name: Set up Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install AJV Schema Validator CLI
        run: npm install -g ajv-cli ajv-formats

      - name: Validate JSON Schemas
        run: |
          echo "Validating Paws Connect Identity Schema..."
          ajv compile -s schemas/paws-connect-identity.json --all-errors
          echo "Validating Dynamic Icon State Schema..."
          ajv compile -s schemas/dynamic-icon-state.json --all-errors 
