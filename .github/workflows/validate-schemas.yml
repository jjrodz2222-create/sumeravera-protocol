
name: Validate SumerAvera Schemas

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  validate-json:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository Code
        uses: actions/checkout@v4

      - name: Set up Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Validate JSON Syntax
        run: |
          node -e "JSON.parse(require('fs').readFileSync('schemas/paws-connect-identity.json'))"
          node -e "JSON.parse(require('fs').readFileSync('schemas/dynamic-icon-state.json'))"
          echo "All JSON schemas are 100% syntactically valid!" 
