name: SumerAvera Sovereign Pipeline

on:
  push:
    tags:
      - 'v*'  # Triggers automatically on any new release tag (e.g., v0.2.0)

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Build Android APK (Release)
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease

      - name: Run TLA+ Formal Verification Checks
        run: |
          # Ensures every build strictly adheres to the 2,222-step invariant model
          echo "Executing TLC Model Checker..."
          java -jar tla2tools.jar -deadlock SumerAvera.tla || exit 1

      - name: Publish Sovereign Release Binary
        uses: softprops/action-gh-release@v1
        with:
          files: app/build/outputs/apk/release/sumeravera-node-release.apk
          name: SumerAvera Protocol Edge Node ${{ github.ref_name }}
          body: |
            ### Sovereign Release Notes
            * Zero-cloud local-first architecture.
            * Gate 1 HMAC-SHA256 ingress validation enabled.
            * Permanent free utility for single-user digital protection.
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
