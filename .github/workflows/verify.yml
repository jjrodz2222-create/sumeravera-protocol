name: Protocol Verification

on: [push, pull_request]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install dependencies
        run: |
          pip install fastapi uvicorn
      - name: Run Core Tests
        # Test-only key for CI: signs test packets only. Not a production
        # secret, and never a real key. The core is fail-closed by design,
        # so the import in direct_test.py needs *some* key set to run.
        env:
          SUMERAVERA_SECRET_KEY: ci-test-only-key-not-a-production-secret
        run: |
          python direct_test.py
      - name: Run Standalone Invariant Audit
        run: |
          chmod +x run_audit_suite.sh
          ./run_audit_suite.sh python3 audit_verify_standalone.py proof_re
